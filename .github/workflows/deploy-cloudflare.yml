name: Deploy — Cloudflare Pages

on:
  # Manual-only for now. This deploy needs Cloudflare secrets (CF_API_TOKEN,
  # CF_ACCOUNT_ID) that aren't configured yet. Builds via @opennextjs/cloudflare
  # and deploys as a Cloudflare Worker (not Pages — next-on-pages only supports
  # Next <=15.5.2, this app is on Next 16).
  # Re-enable `push` once hosting is set up. Run on demand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Build (Next.js → Cloudflare Worker)
        working-directory: services/frontend
        run: npx opennextjs-cloudflare build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: services/frontend
          # API_URL is a runtime var (read server-side by lib/serverApi.ts for the
          # /api/[...path] backend proxy), not a build-time NEXT_PUBLIC_ var — the
          # client only ever calls same-origin /api/*, so it must be wired here.
          command: deploy --var API_URL:${{ secrets.CF_API_URL }}
