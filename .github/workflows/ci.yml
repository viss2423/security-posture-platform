name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  api-syntax-check:
    name: API syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile API source (syntax check)
        run: python -m compileall -q services/api/app

      - name: Result
        run: echo "CI passed for commit ${{ github.sha }} on ${{ github.ref_name }}."
