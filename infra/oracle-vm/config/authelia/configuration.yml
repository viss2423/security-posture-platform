---
# Authelia configuration — MFA gateway for admin dashboards
# Protects: DefectDojo (:8080), Wazuh (:443), OpenCTI (:8090), Keycloak (:8180)

server:
  host: 0.0.0.0
  port: 9091

log:
  level: warn

theme: dark

jwt_secret: "{{ env `AUTHELIA_JWT_SECRET` }}"

default_redirection_url: http://auth.YOURDOMAIN.com

totp:
  issuer: security-posture-platform
  period: 30
  skew: 1

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 1
      salt_length: 16
      parallelism: 8
      memory: 64

access_control:
  default_policy: deny
  rules:
    # Allow health check endpoint without auth
    - domain: auth.YOURDOMAIN.com
      policy: bypass
      resources: ['^/api/health$']
    # Require 2FA for all admin tools
    - domain:
        - defectdojo.YOURDOMAIN.com
        - wazuh.YOURDOMAIN.com
        - opencti.YOURDOMAIN.com
        - keycloak.YOURDOMAIN.com
      policy: two_factor

session:
  name: authelia_session
  secret: "{{ env `AUTHELIA_SESSION_SECRET` }}"
  expiration: 3600
  inactivity: 300
  domain: YOURDOMAIN.com
  redis:
    host: auth-redis
    port: 6379

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 5m

storage:
  local:
    path: /config/db.sqlite3
  encryption_key: "{{ env `AUTHELIA_STORAGE_KEY` }}"

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt
