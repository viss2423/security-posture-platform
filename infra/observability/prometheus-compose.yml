global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: secplat-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: secplat-worker-web
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker-web:9101

  - job_name: secplat-correlator
    metrics_path: /metrics
    static_configs:
      - targets:
          - correlator:9102

  - job_name: secplat-notifier
    metrics_path: /metrics
    static_configs:
      - targets:
          - notifier:9103

  - job_name: secplat-deriver
    metrics_path: /metrics
    static_configs:
      - targets:
          - deriver:9104

  - job_name: secplat-otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8888
