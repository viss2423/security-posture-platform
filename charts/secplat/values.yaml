nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

serviceAccount:
  create: true
  name: ""

config:
  ENV: "prod"
  LOG_LEVEL: "INFO"
  API_URL: "http://secplat-api:8000"
  FRONTEND_URL: "https://secplat.example.com"
  OPENSEARCH_URL: "http://opensearch.secplat.svc.cluster.local:9200"
  REDIS_URL: "redis://redis.secplat.svc.cluster.local:6379/0"
  REQUIRE_DOMAIN_VERIFICATION: "true"
  BLOCK_PRIVATE_IPS: "true"
  MAX_SCAN_DURATION_SECONDS: "900"
  MAX_REQUESTS_PER_SECOND: "2"
  STALE_THRESHOLD_SECONDS: "300"
  EXPECTED_CHECK_INTERVAL_SECONDS: "60"
  LATENCY_SLO_MS: "200"
  DERIVER_INTERVAL_SECONDS: "60"
  ENABLE_SCHEDULED_SNAPSHOTS: "false"
  SCHEDULED_SNAPSHOT_INTERVAL_HOURS: "24"
  PLATFORM_SLI_MATERIALIZATION_INTERVAL_SECONDS: "60"
  PLATFORM_SLI_RUNTIME_MAX_AGE_SECONDS: "300"
  WORKER_METRICS_PORT: "9101"
  CORRELATOR_METRICS_PORT: "9102"
  NOTIFIER_METRICS_PORT: "9103"
  DERIVER_METRICS_PORT: "9104"
  ENABLE_SCHEDULED_TELEMETRY_IMPORT: "false"
  ENABLE_TELEMETRY_KEEPALIVE: "false"
  ENABLE_SCHEDULED_NETWORK_ANOMALY: "false"
  OTEL_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.secplat.svc.cluster.local:4318/v1/traces"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  AI_ENABLED: "false"
  AI_PROVIDER: "ollama"
  AI_TIMEOUT_SECONDS: "60"
  AI_TEMPERATURE: "0.2"
  OLLAMA_BASE_URL: "http://ollama.secplat.svc.cluster.local:11434"
  OLLAMA_MODEL: "llama3.1:8b"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "gpt-4.1-mini"
  INGESTION_OS_URL: "http://opensearch.secplat.svc.cluster.local:9200"
  INGESTION_VERIFY_WEB_URL: "http://verify-web.secplat.svc.cluster.local/.well-known/secplat-verification.txt"
  INGESTION_JUICE_URL: "http://juiceshop.secplat.svc.cluster.local:3000"
  INGESTION_EXAMPLE_COM_URL: "https://example.com"

secretData:
  API_SECRET_KEY: "replace-me"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "replace-me"
  SCANNER_SERVICE_USERNAME: "scanner-service"
  SCANNER_SERVICE_PASSWORD: "replace-me"
  INGESTION_SERVICE_USERNAME: "ingestion-service"
  INGESTION_SERVICE_PASSWORD: "replace-me"
  CORRELATOR_SERVICE_USERNAME: "correlator-service"
  CORRELATOR_SERVICE_PASSWORD: "replace-me"
  API_POSTGRES_DSN: "postgresql+psycopg://secplat_runtime:replace-me@postgres.secplat.svc.cluster.local:5432/secplat"
  API_MIGRATIONS_POSTGRES_DSN: "postgresql+psycopg://secplat:replace-me@postgres.secplat.svc.cluster.local:5432/secplat"
  CORRELATOR_USER: "correlator-service"
  CORRELATOR_PASSWORD: "replace-me"
  SLACK_WEBHOOK_URL: ""
  SLACK_SIGNING_SECRET: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_WHATSAPP_FROM: ""
  WHATSAPP_ALERT_TO: ""
  JIRA_BASE_URL: ""
  JIRA_EMAIL: ""
  JIRA_API_TOKEN: ""
  JIRA_PROJECT_KEY: ""
  OIDC_ISSUER_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_REDIRECT_URI: ""
  OPENAI_API_KEY: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

images:
  api: "ghcr.io/your-org/secplat-api@sha256:1111111111111111111111111111111111111111111111111111111111111111"
  frontend: "ghcr.io/your-org/secplat-frontend@sha256:7777777777777777777777777777777777777777777777777777777777777777"
  workerWeb: "ghcr.io/your-org/secplat-worker-web@sha256:2222222222222222222222222222222222222222222222222222222222222222"
  correlator: "ghcr.io/your-org/secplat-correlator@sha256:3333333333333333333333333333333333333333333333333333333333333333"
  deriver: "ghcr.io/your-org/secplat-deriver@sha256:4444444444444444444444444444444444444444444444444444444444444444"
  notifier: "ghcr.io/your-org/secplat-notifier@sha256:5555555555555555555555555555555555555555555555555555555555555555"
  ingestion: "ghcr.io/your-org/secplat-ingestion@sha256:6666666666666666666666666666666666666666666666666666666666666666"

frontend:
  enabled: true
  replicaCount: 1
  grafanaUrl: "https://grafana.example.com"
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: "secplat.example.com"
    path: "/"
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  replicaCount: 1
  service:
    port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1500m"
      memory: 2Gi

workerWeb:
  replicaCount: 1
  service:
    port: 9101
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

correlator:
  replicaCount: 1
  service:
    port: 9102
  resources:
    requests:
      cpu: 75m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

deriver:
  replicaCount: 1
  service:
    port: 9104
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

notifier:
  replicaCount: 1
  service:
    port: 9103
  resources:
    requests:
      cpu: 75m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

cronjobs:
  ingestion:
    enabled: false
    schedule: "*/1 * * * *"
    successfulJobsHistoryLimit: 2
    failedJobsHistoryLimit: 2
    backoffLimit: 2
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 300
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  snapshot:
    enabled: true
    schedule: "0 */6 * * *"
    successfulJobsHistoryLimit: 2
    failedJobsHistoryLimit: 2
    backoffLimit: 2
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 600
    snapshotPeriod: "24h"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

hpa:
  workerWeb:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    averageUtilization: 70

networkPolicy:
  enabled: true
  kubeSystemNamespace: "kube-system"

dependencies:
  postgres:
    enabled: true
    image: "postgres:16"
    service:
      port: 5432
    auth:
      database: "secplat"
      username: "secplat"
      password: "secplat"
      runtimeUser: "secplat_runtime"
      runtimePassword: "secplat_runtime"
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  redis:
    enabled: true
    image: "redis:7-alpine"
    service:
      port: 6379
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  opensearch:
    enabled: true
    image: "opensearchproject/opensearch:2.14.0"
    service:
      port: 9200
    adminPassword: "admin"
    heap: "512m"
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
