{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: worker-web
          image: {{ .Values.images.workerWeb | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.workerWeb.service.port }}
