              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
{{- range $name, $cfg := dict "correlator" .Values.correlator "notifier" .Values.notifier "deriver" .Values.deriver }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secplat.fullname" $ }}-{{ $name }}
  namespace: {{ include "secplat.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ include "secplat.fullname" $ }}-{{ $name }}
    app.kubernetes.io/part-of: {{ include "secplat.name" $ }}
    secplat-role: {{ $name }}
{{ include "secplat.labels" $ | indent 4 }}
spec:
  replicas: {{ $cfg.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "secplat.fullname" $ }}-{{ $name }}
  template:
    metadata:
      annotations:
        checksum/config-secret: {{ include (print $.Template.BasePath "/config-secret.yaml") $ | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "secplat.fullname" $ }}-{{ $name }}
        app.kubernetes.io/part-of: {{ include "secplat.name" $ }}
        secplat-role: {{ $name }}
    spec:
      serviceAccountName: {{ include "secplat.serviceAccountName" $ }}
      automountServiceAccountToken: false
      securityContext:
{{ toYaml $.Values.podSecurityContext | indent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ index $.Values.images (camelcase $name) | default (index $.Values.images $name) | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $cfg.service.port }}
              name: metrics
          envFrom:
            - configMapRef:
                name: {{ include "secplat.fullname" $ }}-config
            - secretRef:
                name: {{ include "secplat.fullname" $ }}-secrets
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
{{ toYaml $cfg.resources | indent 12 }}
          securityContext:
{{ toYaml $.Values.containerSecurityContext | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
{{- end }}
