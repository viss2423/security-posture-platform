              valueFrom:
                secretKeyRef:
                  name: {{ include "secplat.fullname" . }}-secrets
                  key: SCANNER_SERVICE_USERNAME
            - name: WORKER_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "secplat.fullname" . }}-secrets
