{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secplat.fullname" . }}-frontend
  namespace: {{ include "secplat.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "secplat.fullname" . }}-frontend
    secplat-role: frontend
{{ include "secplat.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "secplat.fullname" . }}-frontend
  template:
    metadata:
      annotations:
        checksum/config-secret: {{ include (print .Template.BasePath "/config-secret.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "secplat.fullname" . }}-frontend
        secplat-role: frontend
    spec:
      serviceAccountName: {{ include "secplat.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: frontend
          image: {{ .Values.images.frontend | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
              name: http
          env:
            - name: API_URL
              value: http://{{ include "secplat.fullname" . }}-api:{{ .Values.api.service.port }}
            - name: NEXT_PUBLIC_GRAFANA_URL
              value: {{ .Values.frontend.grafanaUrl | quote }}
            - name: PORT
              value: {{ .Values.frontend.service.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
{{ toYaml .Values.frontend.resources | indent 12 }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secplat.fullname" . }}-frontend
  namespace: {{ include "secplat.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "secplat.fullname" . }}-frontend
{{ include "secplat.labels" . | indent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "secplat.fullname" . }}-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
---
{{- if .Values.frontend.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "secplat.fullname" . }}-frontend
  namespace: {{ include "secplat.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "secplat.fullname" . }}-frontend
{{ include "secplat.labels" . | indent 4 }}
  {{- with .Values.frontend.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- if .Values.frontend.ingress.className }}
  ingressClassName: {{ .Values.frontend.ingress.className | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.frontend.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.frontend.ingress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "secplat.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
  {{- with .Values.frontend.ingress.tls }}
  tls:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- end }}
{{- end }}
