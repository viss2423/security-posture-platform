apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secplat-worker-egress
  namespace: secplat
  labels:
    app.kubernetes.io/part-of: secplat
spec:
  podSelector:
    matchLabels:
      secplat-role: worker
  policyTypes:
    - Egress
  egress:
    # Worker reads from Redis, talks to the API control plane, and reaches scan targets over HTTP/S.
    # Postgres and OpenSearch stay blocked by omission.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels:
              secplat-role: api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
