apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: secplat
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: secplat
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

    exporters:
      debug:
        verbosity: basic

    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - debug
